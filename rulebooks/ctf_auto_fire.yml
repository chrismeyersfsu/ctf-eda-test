---
- name: CTF Auto Fire Rules
  hosts: all
  sources:
    - ansible.eda.range:
        limit: 5
  rules:
    - name: Fire on first event
      condition: event.i == 1
      action:
        run_playbook:
          name: playbooks/render_vars.yml
          inventory: inventory/hosts
          extra_vars:
            injected_cmd: "{{ injected_cmd | default('NOT_SET') }}"
